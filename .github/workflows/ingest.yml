name: Aggiorna dati

on:
  # PROGETTO SOSPESO dal 22 settembre 2026: gli orari automatici sono tolti.
  # Per riaccendere: ripristinare il blocco schedule da git (git log -- questo file)
  # e riattivare i lavori pg_cron (vedi RECAP.md, "Sospensione").
  workflow_dispatch:
  push:
    paths:
      - 'services/ingest/**'
      - '.github/workflows/ingest.yml'

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Il tetto che mancava. Senza, vale il predefinito di GitHub: SEI ORE, ed e
    # cosi che il 7 e l'8 settembre 2026 tre giri appesi al giorno hanno
    # bruciato la quota di un mese intero.
    #
    # Venti e non dieci perche l'ultimo passo aspetta che Vercel finisca di
    # costruire, e un export Expo sono diversi minuti: un tetto piu stretto
    # ammazzerebbe deploy legittimi. Il freno fine sta sul passo dei dati, che
    # e dove il blocco e successo davvero.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # nessun npm install: l'ingest non ha dipendenze
      - name: Scarica e normalizza
        # Qui e dove si e inceppato. Un giro sano dura 25 secondi: cinque minuti
        # sono venti volte tanto, e se li supera e appeso a una fonte muta.
        # Il tetto del job resta la rete larga, questo e quella stretta.
        timeout-minutes: 5
        env:
          NO_CACHE: '1'
          # Piano gratuito, cento chiamate al giorno. L'ingest le spende solo
          # nella finestra di una partita e per recuperare le formazioni
          # arretrate, quindi la maggior parte dei giri costa zero.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # "rapidapi" per passare dal gateway RapidAPI, vuoto per quello diretto
          API_FOOTBALL_VIA: ${{ secrets.API_FOOTBALL_VIA }}
          # live-score-api: i marcatori delle partite giocate. Senza queste due
          # l'ingest gira lo stesso, e lo dice fra gli avvisi.
          LSA_KEY: ${{ secrets.LSA_KEY }}
          LSA_SECRET: ${{ secrets.LSA_SECRET }}
        run: node services/ingest/run.mjs

      # Il freno sulle pubblicazioni non serve piu: non si pubblica piu da qui.
      - name: Committa se cambiato
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nessuna variazione"
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "satanelli-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "dati: aggiornamento $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"

      # LA PUBBLICAZIONE DEL SITO NON STA PIU QUI.
      #
      # Ci stava, condizionata a 'github.event_name == workflow_dispatch' per
      # farla partire solo a mano. Non funzionava, e in un modo che vale la pena
      # ricordare: i giri automatici SONO workflow_dispatch. E pg_cron su Supabase
      # a chiamare GitHub ogni venti minuti (sveglia_ingest), perche il cron di
      # GitHub non e affidabile. Quella condizione combaciava con l'unica cosa da
      # cui doveva difendere, e ogni giro continuava a pubblicare.
      #
      # Il 13 settembre sono venticinque email di guasto in una notte: Vercel
      # rispondeva 'api-deployments-free-per-day: more than 100' e il giro finiva
      # rosso, per un sito che non serviva ripubblicare -- l'app legge i dati dal
      # repository, non dal sito.
      #
      # Adesso questo workflow fa una cosa sola: raccogliere dati e committarli.
      # Il sito lo pubblica pubblica.yml, a mano, quando serve davvero.
