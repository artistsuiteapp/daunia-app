name: Aggiorna dati

on:
  schedule:
    # ogni 15 minuti. GitHub puo ritardare i cron sui repo pubblici, va bene lo stesso:
    # l'app legge sempre l'ultimo JSON committato.
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'services/ingest/**'
      - '.github/workflows/ingest.yml'

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # nessun npm install: l'ingest non ha dipendenze
      - name: Scarica e normalizza
        env:
          NO_CACHE: '1'
        run: node services/ingest/run.mjs

      - name: Committa se cambiato
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nessuna variazione"
            exit 0
          fi
          git config user.name  "satanelli-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "dati: aggiornamento $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
