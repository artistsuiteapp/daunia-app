name: Aggiorna dati

on:
  schedule:
    # Il ritmo di fondo: ogni sei ore.
    #
    # Era ogni mezz'ora, ed e li che sono finiti i 2.000 minuti del mese.
    # Il conto che non tornava: GitHub non fattura la durata, fattura ogni
    # lavoro arrotondato al minuto intero. Un giro da 24 secondi costa un minuto
    # pieno, quindi la spesa la fa il NUMERO di esecuzioni, non quanto durano.
    # Ogni mezz'ora sono 1.440 minuti al mese per questo cron da solo, prima
    # ancora dei due delle partite e prima di qualunque altro repo dell'account,
    # che pesca dallo stesso monte ore.
    #
    # Sei ore bastano perche qui dentro non c'e niente di urgente: calendario,
    # classifica e rosa vengono da Wikipedia, la rassegna stampa ha gia un freno
    # suo a dodici ore. Punteggio dal vivo, minuto e formazioni non passano da
    # qui: li aggiorna la funzione guardiano su Supabase, che gira ogni minuto
    # e non tocca il monte ore di GitHub.
    - cron: '0 */6 * * *'
    # Nelle ore delle partite si va ogni dieci minuti.
    #
    # Le formazioni ufficiali escono fra i sessanta e i quarantacinque minuti
    # prima del fischio -- il regolamento FIGC impone la distinta all'arbitro
    # a T-45 -- e con la mezz'ora si rischiava di prenderle a T-15. Dieci
    # minuti danno tre tentativi dentro quella finestra.
    #
    # Solo nelle fasce in cui la Serie C gioca davvero: sabato e domenica dal
    # primo pomeriggio a notte, e le infrasettimanali di martedi e mercoledi.
    - cron: '*/10 12-22 * * 6,0'
    - cron: '*/10 16-22 * * 2,3'
  workflow_dispatch:
  push:
    paths:
      - 'services/ingest/**'
      - '.github/workflows/ingest.yml'

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Il tetto che mancava. Senza, vale il predefinito di GitHub: SEI ORE, ed e
    # cosi che il 7 e l'8 settembre 2026 tre giri appesi al giorno hanno
    # bruciato la quota di un mese intero.
    #
    # Venti e non dieci perche l'ultimo passo aspetta che Vercel finisca di
    # costruire, e un export Expo sono diversi minuti: un tetto piu stretto
    # ammazzerebbe deploy legittimi. Il freno fine sta sul passo dei dati, che
    # e dove il blocco e successo davvero.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # nessun npm install: l'ingest non ha dipendenze
      - name: Scarica e normalizza
        # Qui e dove si e inceppato. Un giro sano dura 25 secondi: cinque minuti
        # sono venti volte tanto, e se li supera e appeso a una fonte muta.
        # Il tetto del job resta la rete larga, questo e quella stretta.
        timeout-minutes: 5
        env:
          NO_CACHE: '1'
          # Piano gratuito, cento chiamate al giorno. L'ingest le spende solo
          # nella finestra di una partita e per recuperare le formazioni
          # arretrate, quindi la maggior parte dei giri costa zero.
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          # "rapidapi" per passare dal gateway RapidAPI, vuoto per quello diretto
          API_FOOTBALL_VIA: ${{ secrets.API_FOOTBALL_VIA }}
          # live-score-api: i marcatori delle partite giocate. Senza queste due
          # l'ingest gira lo stesso, e lo dice fra gli avvisi.
          LSA_KEY: ${{ secrets.LSA_KEY }}
          LSA_SECRET: ${{ secrets.LSA_SECRET }}
        run: node services/ingest/run.mjs

      - name: Committa se cambiato
        id: commit
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nessuna variazione"
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "satanelli-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "dati: aggiornamento $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"

      # I dati vivono nel bundle dell'app, quindi committarli non basta: senza
      # questo passo le formazioni pubblicate un'ora prima del fischio
      # finivano nel repository e nell'app non si vedevano.
      #
      # Gira solo quando qualcosa e cambiato davvero: la maggior parte dei
      # giri non tocca niente e non ha senso ricostruire il sito.
      - name: Ricostruisci e pubblica
        # Si pubblica quando cambiano i dati OPPURE quando il commit e opera di
        # una persona.
        #
        # Prima c'era solo la prima condizione, e il difetto era invisibile: una
        # modifica al codice del sito raggiungeva la produzione solo se, per
        # combinazione, in quello stesso giro cambiava anche un dato. Una
        # riscrittura in vercel.json poteva restare fuori per ore senza che
        # nessuno capisse perche il sito era indietro.
        if: steps.commit.outputs.cambiato == 'si' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # `.vercel/` e gitignorato, quindi qui il CLI non sa a quale progetto
          # pubblicare: senza questi due id il deploy non parte. Sono
          # identificatori, non credenziali -- da soli non aprono niente.
          VERCEL_ORG_ID: team_VGV6aA6Wxde9DLsK3m40Zfou
          VERCEL_PROJECT_ID: prj_ArSo71wKaFTenDF67HCvPmGXOMkc
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN assente: i dati sono aggiornati ma il sito resta indietro"
            exit 0
          fi
          # niente build qui: Vercel lo rifa comunque lato suo, e farlo due
          # volte costava tre minuti e un `npm ci` per niente
          if ! npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" > /tmp/deploy.txt 2>&1; then
            echo "::error::deploy Vercel non riuscito"
            tail -30 /tmp/deploy.txt
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' /tmp/deploy.txt | tail -1)
          if [ -z "$URL" ]; then
            echo "::error::deploy non riuscito"
            # senza l'output vero il prossimo che guarda non sa da dove ripartire
            tail -30 /tmp/deploy.txt
            exit 1
          fi
          echo "pubblicato: $URL"

          # NIENTE `vercel alias set` QUI.
          #
          # C'era, e falliva ogni volta con "Error: User not found", facendo
          # risultare rosso un giro in cui il deploy era andato benissimo. Fra
          # il 9 e il 10 settembre 2026 ha mandato quattro o cinque email di
          # errore al giorno per un problema che non esisteva.
          #
          # Non serve: `deploy --prod` assegna gia i domini di produzione del
          # progetto, daunia.vercel.app compreso. Il commento di prima diceva
          # il contrario, ed era sbagliato. Verificato il 10 settembre: una
          # riscrittura pubblicata mentre l'alias falliva era comunque servita
          # dal dominio di produzione.
          #
          # `alias set` e un'operazione a livello di account, non di progetto:
          # gli id qui sopra non bastano a autorizzarla, da cui "User not found".

          # invece di fidarsi, si guarda: il dominio vero deve rispondere
          for tentativo in 1 2 3; do
            CODICE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://daunia.vercel.app/) || CODICE=000
            [ "$CODICE" = "200" ] && break
            sleep 10
          done
          if [ "$CODICE" != "200" ]; then
            echo "::error::pubblicato, ma daunia.vercel.app risponde $CODICE"
            exit 1
          fi
          echo "daunia.vercel.app: $CODICE"
